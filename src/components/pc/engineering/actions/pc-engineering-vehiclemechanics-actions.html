<h3>Vehicle Mechanics R<span name="attr_vehiclemechanics">0</span></h3>
<div class="sheet-actions">
    <!-- Disassemble -->
    <comp-sheet-action-button
        label="Disassemble"
        duration="1 hour"
        prefix="disassemblevehiclemechanics"
        tooltip="You can spend an hour disassembling devices using Vehicle Mechanics Tools. Make a Vehicle Mechanics [LOG] test against 20. On a success, you gain a number of parts from the object’s blueprint up to your Vehicle Mechanics skill Rank. If your Vehicle Mechanics skill Rank is equal to or higher than the object’s complexity, you gain all of its parts and you can not gain more parts of any type than were used to assemble it. If you fail, you don’t gain any parts and destroy the object. Regardless of whether you succeed or not, you gain the object’s power core if it had one installed."
    ></comp-sheet-action-button>
    
    <!-- Reverse Engineer -->
    <comp-sheet-action-button
        label="Reverse Engineer"
        duration="1 hour"
        prefix="reverseengineervehiclemechanics"
        tooltip="You can attempt to reverse engineer the blueprint for any device you scrap. If you do so, you still roll your Vehicle Mechanics [LOG] test as normal. Successfully reverse engineering the device yields no parts, but it does yield a number of pieces of the blueprint up to your Vehicle Mechanics skill ranks, as if you had received them through Designing."
    ></comp-sheet-action-button>
</div>
