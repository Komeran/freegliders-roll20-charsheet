<h3>Tinkering R<span name="attr_tinkering">0</span></h3>
<div class="sheet-actions">
    <!-- Scrap -->
    <comp-sheet-action-button
        label="Scrap"
        duration="1 hour"
        prefix="scrap"
        tooltip="You can spend an hour disassembling an explosive, clockwork, gun, or vehicle using Tinkering tools. Make a Tinkering [LOG] test against 20. On a success, you gain up to a number of parts from the device’s blueprint equal to half your Tinkering skill ranks (rounded up, minimum of 1). If the device’s complexity is equal to or lower than half your Tinkering skill ranks (rounded up, minimum of 1), you gain all of its parts and you can not gain more parts of any type than were used to assemble it. If you fail, you don’t gain any parts and destroy the device. Regardless of whether you succeed or not, you gain the device’s power core if it had one installed."
    ></comp-sheet-action-button>
    
    <!-- Reverse Engineer -->
    <comp-sheet-action-button
        label="Reverse Engineer"
        duration="1 hour"
        prefix="reverseengineertinkering"
        tooltip="You can attempt to reverse engineer the blueprint for any device you scrap. If you do so, you still roll your Tinkering [LOG] test as normal. Successfully reverse engineering the device yields no parts, but it does yield a number of pieces of the blueprint up to your Tinkering skill ranks, as if you had received them through Designing."
    ></comp-sheet-action-button>
</div>
