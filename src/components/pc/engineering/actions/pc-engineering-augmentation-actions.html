<h3>Augmentation R<span name="attr_augmentation">0</span></h3>
<div class="sheet-actions">
    <!-- Disassemble -->
    <comp-sheet-action-button
        label="Disassemble"
        duration="1 hour"
        prefix="disassembleaugmentation"
        tooltip="You can spend an hour disassembling devices using Augmentation Tools. Make a Augmentation [LOG] test against 20. On a success, you gain a number of parts from the object’s blueprint up to your Augmentation skill Rank. If your Augmentation skill Rank is equal to or higher than the object’s complexity, you gain all of its parts and you can not gain more parts of any type than were used to assemble it. If you fail, you don’t gain any parts and destroy the object. Regardless of whether you succeed or not, you gain the object’s power core if it had one installed."
    ></comp-sheet-action-button>
    
    <!-- Reverse Engineer -->
    <comp-sheet-action-button
        label="Reverse Engineer"
        duration="1 hour"
        prefix="reverseengineeraugmentation"
        tooltip="You can attempt to reverse engineer the blueprint for any device you scrap. If you do so, you still roll your Augmentation [LOG] test as normal. Successfully reverse engineering the device yields no parts, but it does yield a number of pieces of the blueprint up to your Augmentation skill ranks, as if you had received them through Designing."
    ></comp-sheet-action-button>
    
    <!-- Functional Prosthetic -->
    <comp-sheet-action-button
        label="Functional Prosthetic"
        duration="1 hour"
        prefix="functionalprosthetic"
        tooltip="You can use Augmentation tools to install a PR 1 Power Source into Prosthetics to restore basic functionality and remove the Missing Limb penalty. This process takes 1 hour and costs 2 Wires in addition to the power source."
    ></comp-sheet-action-button>
    
    <!-- Scrap Surgeon (Prosthetic) -->
    <comp-sheet-action-button
        label="Install Prosthetic"
        duration="1 hour"
        prefix="installprosthetic"
        tooltip="To install a Prosthetic, you need Surgical Tools. Make an Augmentation [AGI] test against 20. You get a bonus to the test equal to the Prosthetic’s quality. On a success, the Prosthetic is installed. On a failure, the creature you tried to install it on takes a number of d6 in slashing damage equal to the Prosthetic’s complexity. This procedure takes you 1 hour. You can add your Medicine skill ranks to the test."
    ></comp-sheet-action-button>
    
    <!-- Scrap Surgeon (Autolimb) -->
    <comp-sheet-action-button
        label="Install Autolimb"
        duration="1 hour"
        prefix="installautolimb"
        tooltip="To install a Autolimb, you need Surgical Tools. Make an Augmentation [AGI] test against 20. You get a bonus to the test equal to the Autolimb’s quality. On a success, the Autolimb is installed. On a failure, the creature you tried to install it on takes a number of d6 in slashing damage equal to the Autolimb’s complexity. This procedure takes you 1 hour. You can add your Medicine skill ranks to the test."
    ></comp-sheet-action-button>
</div>
