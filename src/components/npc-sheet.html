<div class="sheet-npc">
    <h2>NPC</h2>

    <div class="sheet-character-basics">
        <!-- Name -->
        <div>
            <input type="text" name="attr_character_name" />
            <label>Name</label>
        </div>

        <!-- Power Level -->
        <div>
            <input type="number" name="attr_npc_powerLevel" value="0" />
            <label>Power Level</label>
        </div>

        <!-- Size -->
        <div>
            <select name="attr_npc_size">
                <option>Tiny</option>
                <option>Small</option>
                <option selected>Medium</option>
                <option>Large</option>
                <option>Huge</option>
                <option>Gargantuan</option>
                <option>Colossal</option>
            </select>
            <label>Size</label>
        </div>

        <!-- Sanctity -->
        <div>
            <select name="attr_npc_sanctity">
                <option selected>-</option>
                <option>Holy</option>
                <option>Unholy</option>
            </select>
            <label>Sanctity</label>
        </div>

        <!-- Type -->
        <div class="sheet-npc-type">
            <select name="attr_npc_type">
                <option selected value="human">Human</option>
                <option value="animal">Animal</option>
                <option value="mythological">Mythological</option>
            </select>
            <label>Type</label>
        </div>

        <!-- Subtype -->
        <div class="sheet-npc-subtype">
            <select name="attr_npc_subtype">
                <option selected>-</option>
                <option>Angel</option>
                <option>Deity</option>
                <option>Demon</option>
                <option>Risen</option>
                <option>Chimera</option>
                <option>Cryptid</option>
                <option>Monster</option>
                <option>Spirit</option>
            </select>
            <label>Subtype</label>
        </div>
    </div>

    <hr class="sheet-separator" />
    
    <comp-npc-topline></comp-npc-topline>

    <hr class="sheet-separator" />

    <comp-npc-attributes></comp-npc-attributes>

    <comp-npc-attacks></comp-npc-attacks>
</div>
