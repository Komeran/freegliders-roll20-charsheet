<div class="sheet-npc-topline">
    <!-- HP -->
    <div class="sheet-item">
        <comp-sheet-resource
            label="HP"
            prefix="npc_hp"
            calculation="(Body + (Hit Die Max / 2)) × Power Level"
            min="0"
            hasMax="true"
            maxEditable="true"
        ></comp-sheet-resource>
    </div>

    <!-- Hit Die -->
    <div class="sheet-item" name="hitdie">
        <div class="sheet-resource-hitdie">
            <select name="attr_hitdie">
                <option>d4</option>
                <option selected>d6</option>
                <option>d8</option>
                <option>d10</option>
                <option>d12</option>
                <option>d20</option>
            </select>
        </div>
        <label class="sheet-resource-label">Hit Die</label>
    </div>

    <!-- Initiative -->
    <div class="sheet-item">
        <comp-sheet-rollable-mod
            label="Initiative"
            prefix="initiative"
            calculation="AGI + INT"
        ></comp-sheet-rollable-mod>
    </div>

    <!-- Evasion -->
    <div class="sheet-item">
        <comp-sheet-rollable-mod
            label="Evasion"
            prefix="evasion"
            calculation="AGI + INT"
        ></comp-sheet-rollable-mod>
    </div>

    <!-- DAV -->
    <div class="sheet-item">
        <comp-sheet-resource
            label="DAV"
            calculation="Torso AV"
            prefix="npc_dav"
            min="0"
        ></comp-sheet-resource>
    </div>
</div>
